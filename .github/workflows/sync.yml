name: Upstream Sync

permissions:
  contents: write

on:
  schedule:
    - cron: "0 0 * * *" # every day
  workflow_dispatch:

jobs:
  sync_latest_from_upstream:
    name: Sync latest commits from upstream repo
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.fork }}

    steps:
      - name: Check for upstream commits
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          behind=$(gh api "repos/felixonmars/dnsmasq-china-list/compare/master...${GITHUB_REPOSITORY_OWNER}:master" --jq .behind_by)
          if [ "$behind" -gt 0 ]; then
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "Upstream has $behind new commits."
          else
            echo "Fork already contains the latest upstream commit."
          fi

      - name: Checkout target repo
        if: steps.check.outputs.needs_sync == 'true'
        uses: actions/checkout@v6

      - name: Sync upstream changes
        if: steps.check.outputs.needs_sync == 'true'
        id: sync
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          upstream_sync_repo: felixonmars/dnsmasq-china-list
          upstream_sync_branch: master
          target_sync_branch: master
          target_repo_token: ${{ secrets.GITHUB_TOKEN }} # automatically generated, no need to set

          # Set test_mode true to run tests instead of the true action!!
          test_mode: false

      - name: Sync check
        if: failure()
        run: |
          echo "[Error] 上游检查或同步失败，请查看上面的日志。"
          exit 1
