on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Run tests
      run: bundle exec sus
    - name: gen hash
      run: |
        sha256sum accelerated-domains.china.conf > accelerated-domains.sha256
    - uses: actions/upload-artifact@v7
      with:
        name: accelerated-domains-sha256
        path: accelerated-domains.sha256
